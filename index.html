<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>出張上申自動作成システム2026</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit@0.0.4/dist/fontkit.umd.js"></script>
  <style>
    /* 画面全体を少しグレーにして、アプリっぽくする */
    body {
      background-color: #f3f4f6;
      font-family: sans-serif;
      padding: 20px;
    }

    /* 入力フォーム全体を「白いカード」のように浮かび上がらせる */
    #business-trip-form, #special-activity-form {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px; /* 角を丸くする */
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* 影をつける */
      max-width: 800px;
      margin: 0 auto; /* 画面の中央に配置 */
    }

    /* 💡 グループごとに下の余白をあける */
    .form-group {
      margin-bottom: 20px;
    }

    /* ラベル（見出し）のデザイン */
    label {
      display: block; /* 入力欄の上に改行して表示させる */
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    /* 入力欄（テキスト、日付、時間、数字、プルダウン）のデザイン */
    input[type="text"], input[type="date"], input[type="time"], input[type="number"], select {
      width: 100%; /* 横幅いっぱいに広げる */
      padding: 10px; /* 内側に余白を作ってタップしやすくする */
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box; /* 枠線がはみ出ないようにする */
    }
    
    /* 💡 横並びにしたい場合の小技 */
    .flex-group {
      display: flex;
      gap: 15px; /* 要素の間に15pxの隙間をあける */
    }
    .flex-group > div {
      flex: 1; /* 箱の横幅を均等（1:1）にする */
    }

    /* 区切り線のデザイン */
    .divider {
      border: none;
      border-top: 2px dashed #e5e7eb; /* 点線にする */
      margin: 30px 0; /* 上下に広めの余白を取る */
    }

    /* ボタン全体をモダンにする */
    button {
      background-color: #2563eb; /* スタイリッシュなブルー */
      color: white; /* 文字は白 */
      border: none;
      padding: 14px 20px; /* 大きくして押しやすく */
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px; /* 少し丸みを持たせる */
      cursor: pointer; /* マウスを乗せたら指マークにする */
      width: 100%; /* 横幅いっぱいの目立つボタンにする */
      margin-bottom: 15px; /* ボタン同士の隙間 */
      transition: background-color 0.2s; /* 色が変わるアニメーション */
    }
    
    /* マウスが乗った時の色（ホバーアクション） */
    button:hover {
      background-color: #1d4ed8; /* 少し濃いブルーにする */
    }

    /* 「特別活動願」などのサブボタンは色を変える場合の例 */
    #btn-next-special {
      background-color: #10b981; /* グリーン系で別機能であることをアピール */
    }
    #btn-next-special:hover {
      background-color: #059669;
    }

    /* 💡 特別活動願のチェックボックスを横並びにする */
   /* 💡 特別活動願のチェックボックスを横並びにする */
    #time_select {
      display: flex;
      flex-wrap: wrap; /* 端までいったら折り返す */
      gap: 15px; /* 項目同士の隙間 */
      margin-bottom: 20px;
    }

    /* 💡 チェックボックスと文字をセットにする小さな箱 */
    .checkbox-item {
      display: flex;
      align-items: center; /* 縦のズレを中央で揃える */
      gap: 5px; /* 四角と文字の間の小さな隙間 */
    }

    /* チェックボックスの文字の太字を解除 */
    .checkbox-item label {
      margin-bottom: 0;
      font-weight: normal; 
    } 
    /* チェックボックスと文字を綺麗にくっつける */
    #time_select label {
      display: inline-block; /* 縦並びのブロックから、横並びに変更 */
      margin-bottom: 0;
      font-weight: normal; /* 太字を解除 */
    }
  </style>
</head>
<body>
  <!-- =================================
      1.　出張上申　入力エリア
        ================================ -->
  <div id="business-trip-form">
    <h2>出張上申　必要項目入力</h2>

    <!-- 2. 作成日 -->
    <div class="form-group">
      <label for="sakuseibi">作成日：</label> 
      <input type="date" id="sakuseibi">
    </div>

    <!-- 3. 申請者 -->
    <div class="form-group">
      <label for="name">申請者名：</label>
      <input type="text" autocomplete="name" id="name" placeholder="東海 太郎">
    </div>
    

    <br>
    <!-- 4. 所属(学年プルダウン、部活動名プルダウン) -->
    <div class="form-group flex-group">
      <div>
        <label for="syozoku-gakunen">所属/学年：</label>
          <select id="gakunen-select">
            <option value="">1つ選択してください</option>
            <option value="1学年" deta-id="data1-id1">1学年</option>
            <option value="2学年" deta-id="data2-id2">2学年</option>
            <option value="3学年" deta-id="data3-id3">3学年</option>
            <option value="学年所属なし" deta-id="data4-id4">学年所属なし</option>
          </select>
      </div>

      <div>
        <label for="bukatsu">部活：</label>
          <select id="bukatsu">
            <option value="">1つ選択してください</option>
            <option value="柔道部" bdata-id="bdata1-id1">柔道部</option>
            <option value="野球部" bdata-id="bdata2-id2">野球部</option>
            <option value="サッカー部" bdata-id="bdata3-id3">サッカー部</option>
            <option value="女子サッカー部" bdata-id="bdata4-id4">女子サッカー部</option>
            <option value="女子バスケットボール部" bdata-id="bdata5-id5">女子バスケットボール部</option>
            <option value="陸上競技部" bdata-id="bdata6-id6">陸上競技部</option>
            <option value="バドミントン部" bdata-id="bdata7-id7">バドミントン部</option>
            <option value="ラグビー部" bdata-id="bdata8-id8">ラグビー部</option>
            <option value="剣道部" bdata-id="bdata9-id9">剣道部</option>
            <option value="チアリーディング部" bdata-id="bdata10-id10">チアリーディング部</option>
            <option value="女子バレーボール部" bdata-id="bdata11-id11">女子バレーボール部</option>
            <option value="男子バスケットボール部" bdata-id="bdata12-id12">男子バスケットボール部</option>
            <option value="男子ソフトテニス部" bdata-id="bdata13-id13">男子ソフトテニス部</option>
            <option value="女子ソフトテニス部" bdata-id="bdata14-id14">女子ソフトテニス部</option>
            <option value="卓球部" bdata-id="bdata15-id15">卓球部</option>
            <option value="ダンス部" bdata-id="bdata16-id16">ダンス部</option>
            <option value="総合部" bdata-id="bdata17-id17">総合部</option>
            <option value="吹奏楽部" bdata-id="bdata18-id18">吹奏楽部</option>
            <option value="書道部" bdata-id="bdata19-id19">書道部</option>
            <option value="写真部" bdata-id="bdata20-id20">写真部</option>
            <option value="スポーツクライミング部" bdata-id="bdata22-id22">スポーツクライミング部</option>
          </select>
      </div>
    </div>


        <br>  
        <!-- 5. 出張期間（開始日　〜　終了日） -->
        <div class="form-group">
          <label>出張期間：</label>
            <div class="flex-group">
              <div>
                <label for="start-syuttyou-kikan">始まり</label>
                <input type="date" id="start">
              </div>
              <div>
                <label for="end-syuttyou-kikan">終わり</label>
                <input type="date" id="end">
              </div>
            </div>
        </div>

              <br>
        <div class="form-group">
          <label>出張時間：</label>
            <div class="flex-group">
              <div>
                <label for="start-jikan">始まり</label>
                <input type="time" id="start_time">
              </div>
              <div>
                <label for="end-jikan">終わり</label>
                <input type="time" id="end_time">
              </div>
            </div>
        </div>


        <br>
        <!-- 6. 業務数・宿泊数・生徒引率・部活動指導 -->
        <div class="form-group flex-group">
          <div>
            <label for="gyoumu">業務日数：</label>
            <div style="display: flex; aligin-items: center; gap: 5px;">
              <input type="number" value="1" min="1" step="1" id="gyoumu">
              <span>日</span>
            </div>
          </div>

          <div>
            <label for="syukuhaku">宿泊数：</label>
            <div style="display: flex; align-items: center; gap: 5px;">
              <input type="number" value="0" min="0" step="1" id="syukuhaku">
              <span>日</span>
            </div>
          </div>
        </div>

        <div class="form-group flex-group">
          <div>
            <label for="insotu">生徒引率：</label>
            <select id="insotu">
              <option value="">選択：</option>
              <option value="有">有</option>
              <option value="無">無</option>
            </select>
          </div>

          <div>
            <label for="bukatsu-sido">部活指導：</label>
            <select id="sido">
              <option value="">選択：</option>
              <option value="有">有</option>
              <option value="無">無</option>
            </select>
          </div>
        </div>

        <!-- 7. 出張先  -->
        <div class="form-group">
          <label for="syuttyousaki">出張先：</label>
          <input type="text" id="syuttyousaki" value="" placeholder="東海大学 湘南校舎">
        </div>


        <div class="form-group">
          <label for="adorres">出張先住所：</label>
          <input type="text" id="adorres" value="" placeholder="811-4193　福岡県宗像市田久1-9-2">
        </div>

        <!-- 8. 目的　-->
        <div class="form-group">
          <label for="mokuteki">目的：</label>
          <input type="text" id="mokuteki" value="" placeholder="学園オリンピックのため">
        </div>


        <!-- 9. 主催　-->
        <div class="form-group">
          <label for="syusaisya">主催：</label>
          <input type="text" id="syusai" value="" placeholder="東海大学学校法人スポーツ課">
        </div>


        <br>
        <!-- 10. 利用交通　-->
        <div class="form-group">
          <label for="riyoukoutu">利用交通：</label>
          <select id="riyoukoutu">
            <option value="">選択：</option>
            <option value="公共交通機関" id="kou">公共交通機関</option>
            <option value="自家用車" id="ji">自家用車</option>
            <option value="公用車" id="kouy">公用車</option>
            <option value="その他" id="sono">その他</option>
          </select>
        </div>
        <!-- 公共交通機関を選択した場合、さらに選択 -->
        <div class="form-group">
          <div id="koutyoukoutu-sentaku" style="display: none;">
            <select id="kou-sentaku">
              <option value="hikouki">飛行機</option>
              <option value="densya">電車</option>
              <option value="bus">バス</option>
            </select>
          </div>
        </div>

        <!-- 自家用車を選択した場合 -->
        <div class="form-group">
          <div id="jikayousya-sentaku" style="display: none;">    
            <select id="kou-sentaku2">
              <option value="">選択してください</option>
              <option value="honnninn">本人</option>
              <option value="tasya" id="tasya">他者</option>
            </select>
          </div>
        </div>

        <!-- 他者を選択した場合、誰の車に乗ったかを把握するための入力欄 -->
        <div class="form-group">
          <div id="tasya-sentaku" style="display: none;">    
            <label for="tasya-sentaku">同乗した人の氏名を記入：</label>
              <input type="text" id="doujou">
          </div>
        </div>


        <br>
        <!-- 11. 経路　-->
        <div class="form-group">
          <label for="keiro" id="keiro">経路：</label>
          <br>
          <span class="hajime">スタート</span>
              <input type="text" id="hajime" placeholder="赤間駅">
        </div>

        <div class="form-group">
          <div id="keiro-totyu">
            <div class="keiro-row">
              <span class="keiro">途中</span>
                <input type="text" value="" placeholder="小田原駅など">
            </div>
          </div>
          <button type="button" id="keiro-totyu-btn">途中の道のり 追加</button>
        </div>

        <div class="form-group">
          <br>
          <span class="owari">終着点</span>
              <input type="text" id="owari" placeholder="博多駅">
        </div>
        
        <br>
        <!-- =================================================
              ボタンエリア
              ================================================ -->
        <button type="button" id="btn-syuttyou-succes">出張上申を作成</button>
        <button type="button" id="btn-next-special">特別活動願の追加作成</button>


    <!-- ①　出張上申のみ作成ボタン -->
    <!-- ②　特別活動願の追加入力へ進むボタン -->
  </div>


  <br>
  <!-- ===================================
        2. 特別活動願　追加入力エリア
        ※最初は見えないように隠しておく（display: none;)
        ================================== -->
  <div id="special-activity-form" style="display: none;">
    <h2>特別活動願　追記入力</h2>
    <!-- 参加生徒情報（［学年プルダウン］＋［氏名入力欄］）のセットを5行ほど作成 -->
    <label for="time-select">特別活動願の時間申請の選択：</label>
      <div id="time_select">
        <div class="checkbox-item">
          <input type="checkbox" name="特別活動の時間申請" value="時間延長" id="time_id1">　
          <label for="time_id1">時間延長</label>
        </div>
        <div>
          <input type="checkbox" name="特別活動の時間申請" value="早朝" id="time_id2">　
          <label for="time_id2">早朝</label>
        </div>
        <div>
            <input type="checkbox" name="特別活動の時間申請" value="土曜日" id="time_id3">
            <label for="time_id3">土曜日</label>
        </div>
        <div>
          <input type="checkbox" name="特別活動の時間申請" value="日曜日" id="time_id4">　
          <label for="time_id4">日曜日</label>
        </div>
        <div>
          <input type="checkbox" name="特別活動の時間申請" value="祭日" id="time_id5">　
          <label for="time_id5">祭日</label>
        </div>
        <div>
          <input type="checkbox" name="特別活動の時間申請" value="校外活動" id="time_id6">　
          <label for="time_id6">校外活動</label>
        </div>
        <div>
          <input type="checkbox" name="特別活動の時間申請" value="休暇中" id="time_id7">　
          <label for="time_id7">休暇中</label>
        </div>
        <div>
          <input type="checkbox" name="特別活動の時間申請" value="試験前" id="time_id8">　
          <label for="time_id8">試験前</label>
        </div>
        <div>
          <input type="checkbox" name="特別活動の時間申請" value="試験中" id="time_id9">　
          <label for="time_id9">試験中</label>
        </div>
        <div>
          <input type="checkbox" name="特別活動の時間申請" value="対外試合" id="time_id10">　
          <label for="time_id10">対外試合</label>
        </div>
      </div>

    <div class="form-group">
      <label for="teacher-name">引率者氏名：</label>
        <br>
        <div id="insotu_name_area">
          <div class="insotu-row">
            <input type="text" name="引率者氏名" placeholder="東海太郎">
          </div>
        </div>
      <button type="button" id="insotu_name_btn">引率者追加</button>
    </div>
    <br>
    <div class="form-group">
      <label for="seito-name">学年氏名入力：</label>

        <div id="student-list-area">
          <div class="student-row flex-group" style="margin-bottom: 10px;">
            <!-- 学年 -->
            <div>
              <label>学年</label>
              <input type="number" value="1" min="1" max="3" step="1">
            </div>

            <div>
              <label>組</label>
              <input type="number" value="1" min="1" max="10" step="1">
            </div>
            <!-- 氏名 -->
            <div style="flex: 2;">
              <label>氏名：</label>
              <input type="text" placeholder="東海 太郎">
            </div>
          </div>
        </div>

      <button type="button" id="add-student-btn">生徒追加</button>
    </div>
    <!-- ③　最終作成ボタン -->
  <div class="form-group">
    <button type="button" id="tokubetsu-btn">特別活動願作成ボタン</button>
  </div>

  <!-- ===================================
        3. 印刷プレビューエリア
    　　※　最初は見えないように隠しておく
        ================================== -->
  <div id="print-preview-area" style="display: none;">
    <!-- Excel/Wordの雛形を再現するエリア。今は空のままでOKです！ -->
  </div>

  <script>
    // JavaScriptの動き（表示切り替えやデータ取得）は後でここに書いていきます
    // 〈フェーズ1〉　画面の切り替え
    //　①　要素を捕まえる
    const special_button = document.getElementById('btn-next-special');
    const syuttyou_area = document.getElementById('business-trip-form');
    const tokubetsu_area = document.getElementById('special-activity-form');
    const addStudent_button = document.getElementById('add-student-btn');
    const addstudentListArea = document.getElementById('student-list-area')
    const syuttyou_button = document.getElementById('btn-syuttyou-succes');
    const tokubetsu_button = document.getElementById('tokubetsu-btn');
    const print_preview_area = document.getElementById('print-preview-area');
    const add_keiro_area = document.getElementById('keiro-totyu');
    const add_keiro_btn = document.getElementById('keiro-totyu-btn');
    const riyoukoutu_select = document.getElementById('riyoukoutu');
    const koutyoukoutu_div = document.getElementById('koutyoukoutu-sentaku');
    const jikayousya_div = document.getElementById('jikayousya-sentaku');
    const kou_sentaku2_select = document.getElementById('kou-sentaku2');
    const tasya_sentaku_div = document.getElementById('tasya-sentaku');
    const insotu_area = document.getElementById('insotu_name_area');
    const insotu_btn = document.getElementById('insotu_name_btn');

    //　②　クリックされた時を検知する
    special_button.addEventListener('click', function(){
      //　③　要素を隠す
      syuttyou_area.style.display='none';
      //　④　要素を出現させる
      tokubetsu_area.style.display='block';
    });

    // ①　「利用交通」が変更された時の処理
    riyoukoutu_select.addEventListener('change', function() {
      // まずは全てに透明マントを被せる（リセット）
      koutyoukoutu_div.style.display = 'none';
      jikayousya_div.style.display = 'none';
      tasya_sentaku_div.style.display = 'none';

      // 選ばれた値によって、特定のマントだけを脱がせる（blockにする）
      if (this.value === '公共交通機関') {
        koutyoukoutu_div.style.display = 'block';
      } else if (this.value === '自家用車') {
        jikayousya_div.style.display = 'block';
      }
    });
    
    // ②　「本人・他者」が変更された時の処理
    kou_sentaku2_select.addEventListener('change', function() {
      if (this.value === 'tasya') {
        tasya_sentaku_div.style.display = 'block';
      }else {
        tasya_sentaku_div.style.display = 'none';
      }
    });


    //　〈フェーズ2〉　入力欄の動的追加
    addStudent_button.addEventListener('click', function(){
      const newRow = `
        <div class="student-row flex-group" style="margin-bottom: 10px;">
          <div>
            <label>学年</label>
            <input type="number" value="1" min="1" max="3" step="1">
          </div>
          <div>
            <label>組</label>
            <input type="number" value="1" min="1" max="10" step="1">
          </div>
          <div style="flex: 2;">
            <label>氏名：</label>
            <input type="text" placeholder="東海 太郎">
          </div>
        </div>
      `;

      addstudentListArea.insertAdjacentHTML('beforeend', newRow);

    });

    // 経路の途中をボタンを押して増やす使用に変更→その対応処理
    add_keiro_btn.addEventListener('click', function(){
      const NewRow = `
        <div class="keiro-row">
            <span class="keiro">途中</span>
              <input type="text" value="" placeholder="小田原駅など">
        </div>
      `;

      add_keiro_area.insertAdjacentHTML('beforeend', NewRow); 
    });


    // 引率教員追加ボタン
    insotu_btn.addEventListener('click', function(){
      const NewName = `
      <div class="insotu-row">
        <input type="text" name="引率者氏名" placeholder="東海太郎">
      </div>
      `;

     insotu_area.insertAdjacentHTML('beforeend', NewName); 
    });

    //　〈フェーズ3〉　データの取得とプレビュー生成
    // ①　大元のスイッチを準備する
